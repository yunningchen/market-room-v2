<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Room V4.1</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#172236;--panel2:#101b2d;--line:#2d405b;--text:#e9f0fb;--muted:#a8b6cb;--green:#72e0b1;--red:#ffa6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:1250px;margin:auto;padding:32px 22px 72px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:30px}h1{margin:0;font-size:32px;letter-spacing:-.6px}h2{font-size:18px;margin:0 0 12px}.sub,.muted{color:var(--muted)}.sub{margin:4px 0}.stamp{padding:8px 14px;border:1px solid var(--line);border-radius:30px;background:#1b3046;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.stat,.panel,.detail-card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.stat{padding:18px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:4px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin-bottom:20px}input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:12px;outline:none}input:focus,select:focus,button:focus-visible{outline:2px solid #80b7ff}.panel{padding:20px;overflow:hidden}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:860px}th{text-align:left;color:var(--muted);font-size:13px;white-space:nowrap;cursor:pointer;user-select:none}th,td{padding:13px 10px;border-bottom:1px solid var(--line)}tbody tr{cursor:pointer}tbody tr:hover{background:#21324b}.symbol{font-size:12px;color:var(--muted)}.score,.positive{color:var(--green);font-weight:700}.negative{color:var(--red)}.pill{display:inline-block;background:#2a4059;border-radius:7px;padding:3px 8px;font-size:12px}.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:16px}.btn{border:1px solid var(--line);border-radius:9px;background:#263b55;color:var(--text);padding:9px 13px;font:inherit;cursor:pointer}.btn:disabled{opacity:.4;cursor:default}.foot{color:var(--muted);font-size:12px;margin-top:20px}.overlay{position:fixed;inset:0;background:#000a;display:none;z-index:10}.overlay.show{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(650px,100%);background:#0f1a2c;border-left:1px solid var(--line);overflow:auto;padding:24px}.drawerhead{display:flex;align-items:start;justify-content:space-between;gap:12px}.drawer h2{font-size:24px;line-height:1.3;margin:0}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.detail-card{padding:14px}.detail-card small{color:var(--muted);display:block}.detail-card strong{font-size:21px}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.section p{margin:9px 0}.bullet{margin:8px 0;padding-left:22px}.notice{border:1px solid #596179;background:#202c40;border-radius:10px;padding:12px;color:#d8e4f4}.empty{padding:40px 10px;text-align:center;color:var(--muted)}@media(max-width:760px){main{padding:22px 12px}h1{font-size:27px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:span 2}.panel{padding:12px}.stat strong{font-size:24px}.drawer{padding:18px}}
</style></head><body><main><header><div><h1>📈 Market Room <span style="font-size:14px;color:var(--muted)">V4.1</span></h1><p class="sub">台股 × 美股｜波段觀察儀表板</p></div><span class="stamp" id="updated">載入中…</span></header>
<section class="stats"><div class="stat"><small>累積成功掃描</small><strong id="total">—</strong></div><div class="stat"><small>近期有效資料</small><strong id="recent">—</strong></div><div class="stat"><small>候選證券總數</small><strong id="candidates">—</strong></div><div class="stat"><small>已嘗試批次</small><strong id="batches">—</strong></div></section>
<div class="filters"><input id="q" placeholder="搜尋代號或公司名稱" aria-label="搜尋股票"><select id="market" aria-label="市場"><option value="">全部市場</option></select><select id="group" aria-label="技術分類"><option value="">全部技術分類</option></select><select id="minScore" aria-label="最低分數"><option value="0">不限分數</option><option value="80">80 分以上</option><option value="90">90 分以上</option><option value="100">100 分</option></select></div>
<section class="panel"><div class="panelhead"><h2>股票觀察排行榜</h2><span class="muted" id="count">準備讀取資料</span></div><div class="scroll"><table><thead><tr><th data-key="symbol">股票 ↕</th><th data-key="market">市場 ↕</th><th data-key="score">評分 ↕</th><th data-key="category">技術判斷 ↕</th><th data-key="rsi14">RSI ↕</th><th data-key="volume_ratio">量比 ↕</th><th data-key="close">收盤價 ↕</th><th data-key="date">行情日期 ↕</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">載入中…</td></tr></tbody></table></div><div class="pager"><span class="muted" id="pageLabel"></span><button class="btn" id="prev">上一頁</button><button class="btn" id="next">下一頁</button></div></section>
<p class="foot">資料來源：Market Room GitHub Actions 日 K 線掃描。僅顯示掃描時間及行情日期都在最近 7 天內的股票。排行榜是已掃描股票的技術條件排序，並非全市場即時排行。點選任一股票可查看詳細指標。MACD 顯示柱狀圖數值，不是完整 MACD 線與訊號線。</p></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="個股技術分析"><aside class="drawer"><div class="drawerhead"><div><h2 id="detailTitle">個股分析</h2><div class="muted" id="detailSub"></div></div><button class="btn" id="close" aria-label="關閉">✕ 關閉</button></div><div id="detailBody"></div></aside></div>
<script>
const $=id=>document.getElementById(id);let all=[],filtered=[],page=0,sortKey='score',sortDir=-1;const pageSize=30;
function csvParse(text){const out=[];let row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c}else if(c==='"')quote=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))out.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);out.push(row)}const header=(out.shift()||[]).map(x=>x.replace(/^\uFEFF/,''));return out.map(r=>Object.fromEntries(header.map((h,i)=>[h,r[i]||''])))}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v){let n=Number(v);return Number.isFinite(n)?n:NaN}function fmt(v,d=2){return Number.isFinite(num(v))?num(v).toFixed(d):'—'}function recent(s,days=7){let t=Date.parse(s);return Number.isFinite(t)&&t<=Date.now()+86400000&&t>=Date.now()-days*86400000}function isTW(m){return /TWSE|TPEX|TAIWAN|上市|上櫃|台股/i.test(m||'')}function text(v){return escapeHtml(v||'—')}
function render(){let q=$('q').value.trim().toLowerCase(),m=$('market').value,g=$('group').value,min=num($('minScore').value);filtered=all.filter(r=>(!q||(r.symbol+' '+r.name).toLowerCase().includes(q))&&(!m||r.market===m)&&(!g||r.category===g)&&num(r.score)>=min);filtered.sort((a,b)=>{let x=a[sortKey]??'',y=b[sortKey]??'';if(['score','rsi14','volume_ratio','close','ma20','ma60','macd_hist'].includes(sortKey)){return ((num(x)||0)-(num(y)||0))*sortDir}return String(x).localeCompare(String(y),'zh-Hant')*sortDir});let pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages-1);$('count').textContent='符合條件 '+filtered.length+' 檔';$('pageLabel').textContent=filtered.length?`${page+1} / ${pages} 頁`:'0 / 0 頁';$('prev').disabled=page<=0;$('next').disabled=page>=pages-1;let rows=filtered.slice(page*pageSize,(page+1)*pageSize);$('rows').innerHTML=rows.length?rows.map((r,i)=>`<tr data-index="${page*pageSize+i}" tabindex="0" aria-label="查看 ${text(r.symbol)} 詳細分析"><td><strong>${text(r.name||r.symbol)}</strong><div class="symbol">${text(r.symbol)}</div></td><td>${text(r.market)}</td><td class="score">${text(r.score)}</td><td><span class="pill">${text(r.category)}</span></td><td>${fmt(r.rsi14)}</td><td class="${num(r.volume_ratio)>=1.5?'positive':''}">${fmt(r.volume_ratio)}</td><td>${fmt(r.close)}</td><td>${text(r.date)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">目前沒有符合條件的股票</td></tr>'}
function showDetail(r){$('detailTitle').textContent=r.name||r.symbol;$('detailSub').textContent=`${r.symbol} · ${r.market} · 行情日期 ${r.date}`;let close=num(r.close),ma20=num(r.ma20),ma60=num(r.ma60),rsi=num(r.rsi14),vol=num(r.volume_ratio),hist=num(r.macd_hist);let insights=[];if(Number.isFinite(close)&&Number.isFinite(ma20))insights.push(close>ma20?'收盤價位於 MA20 上方，短期價格偏強。':close<ma20?'收盤價位於 MA20 下方，短期價格偏弱。':'收盤價接近 MA20。');if(Number.isFinite(ma20)&&Number.isFinite(ma60))insights.push(ma20>ma60?'MA20 高於 MA60，中期均線排列偏多。':ma20<ma60?'MA20 低於 MA60，中期均線排列偏弱。':'MA20 與 MA60 接近。');if(Number.isFinite(hist))insights.push(hist>0?'MACD 柱狀圖為正值，動能偏多；無法僅憑這個數值確認黃金交叉。':hist<0?'MACD 柱狀圖為負值，動能偏弱；無法僅憑這個數值確認死亡交叉。':'MACD 柱狀圖接近零。');if(Number.isFinite(rsi))insights.push(rsi>=70?'RSI 已達 70 以上，短線可能偏熱。':rsi<=30?'RSI 在 30 以下，屬偏弱／超賣區間。':rsi>=50?'RSI 高於 50，動能相對偏強。':'RSI 低於 50，動能相對偏弱。');if(Number.isFinite(vol))insights.push(vol>=1.5?'相對成交量達 1.5 倍以上，量能明顯放大。':vol>=1?'相對成交量至少約 1 倍，量能未明顯萎縮。':'相對成交量不足 1 倍，需留意量能支持。');let cells=[['技術評分',r.score,'分'],['收盤價',fmt(r.close),''],['MA20',fmt(r.ma20),''],['MA60',fmt(r.ma60),''],['MACD 柱狀圖',fmt(r.macd_hist,4),''],['RSI（14）',fmt(r.rsi14),''],['相對成交量',fmt(r.volume_ratio),'倍'],['技術分類',r.category,'']];$('detailBody').innerHTML=`<div class="detail-grid">${cells.map(([k,v,u])=>`<div class="detail-card"><small>${text(k)}</small><strong>${text(v)}</strong> ${text(u).replace('—','')}</div>`).join('')}</div><section class="section"><h2>技術訊號解讀</h2><ul class="bullet">${insights.map(s=>`<li>${text(s)}</li>`).join('')}</ul></section><section class="section"><h2>掃描器原始判斷</h2><p>技術分類：<strong>${text(r.category)}</strong></p><p>波段分組：<strong>${text(r.swing_group)}</strong></p><p>成交量狀態：<strong>${text(r.volume_status)}</strong></p><p>風險提示：<strong>${text(r.risk_warning)}</strong></p></section><section class="section"><h2>資料時間與使用提醒</h2><p>行情日期：${text(r.date)}</p><p>掃描時間（UTC）：${text(r.last_checked_utc)}</p><div class="notice">這是日線技術資料的條件解讀，不是即時報價。資料未提供完整 K 線序列、支撐壓力價位或 MACD／訊號線，因此不會虛構這些資訊。</div></section>`;$('overlay').classList.add('show');document.body.style.overflow='hidden';$('close').focus()}
function closeDetail(){$('overlay').classList.remove('show');document.body.style.overflow=''}
async function init(){try{const stamp=Date.now();let [csvResp,statusResp]=await Promise.all([fetch('./data/ranking.csv?v='+stamp,{cache:'no-store'}),fetch('./data/status.json?v='+stamp,{cache:'no-store'}).catch(()=>null)]);if(!csvResp.ok)throw Error('ranking.csv HTTP '+csvResp.status);let rows=csvParse(await csvResp.text());all=rows.filter(r=>recent(r.date)&&recent(r.last_checked_utc));$('recent').textContent=all.length.toLocaleString('en-US');let status={};if(statusResp&&statusResp.ok){try{status=await statusResp.json()}catch(e){}}const pick=(obj,keys)=>{for(const k of keys)if(obj&&obj[k]!==undefined&&obj[k]!==null)return obj[k];return null};let total=pick(status,['total_scanned','cumulative_scanned','scanned','success_count','total_success']);$('total').textContent=(total??rows.length).toLocaleString?.('en-US')??String(total??rows.length);let candidates=pick(status,['total_candidates','candidate_count','candidates','universe_size']);$('candidates').textContent=candidates==null?'—':Number(candidates).toLocaleString('en-US');let batch=pick(status,['batch','batch_number','attempted_batches','batches_done']),batchTotal=pick(status,['total_batches','batch_total']);$('batches').textContent=batch==null?'—':String(batch)+(batchTotal==null?'':' / '+batchTotal);let latest=all.map(r=>Date.parse(r.last_checked_utc)).filter(Number.isFinite).sort((a,b)=>b-a)[0];$('updated').textContent=latest?'最新掃描：'+new Date(latest).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'資料已載入';for(const [id,key] of [['market','market'],['group','category']]){let options=[...new Set(all.map(r=>r[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));$(id).insertAdjacentHTML('beforeend',options.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join(''))}render()}catch(err){$('updated').textContent='資料載入失敗';$('rows').innerHTML=`<tr><td colspan="8" class="empty">無法讀取股票資料：${escapeHtml(err.message)}。請確認 docs/data/ranking.csv 已存在。</td></tr>`;console.error(err)}}
for(const id of ['q','market','group','minScore'])$(id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()});document.querySelectorAll('th[data-key]').forEach(th=>th.addEventListener('click',()=>{let k=th.dataset.key;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='score'?-1:1}page=0;render()}));$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('rows').addEventListener('click',e=>{let tr=e.target.closest('tr[data-index]');if(tr)showDetail(filtered[Number(tr.dataset.index)])});$('rows').addEventListener('keydown',e=>{if(e.key==='Enter'){let tr=e.target.closest('tr[data-index]');if(tr)showDetail(filtered[Number(tr.dataset.index)])}});$('close').onclick=closeDetail;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});init();
</script></body></html>
