<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Room｜波段觀察儀表板</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#e7ecf5;background:#0c1220}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}h1{margin:0;font-size:28px}p{color:#9eabc1}small,.muted{color:#9eabc1}.pill{background:#192b3e;border:1px solid #2b445b;border-radius:30px;padding:8px 12px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#151f30;border:1px solid #2a3649;border-radius:16px;padding:18px}.stat{font-size:28px;font-weight:750;margin:8px 0}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin:20px 0}input,select{width:100%;background:#111b2b;color:#f1f4fa;border:1px solid #344258;border-radius:10px;padding:12px;font:inherit}table{border-collapse:collapse;width:100%;min-width:880px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #2a3649;white-space:nowrap}th{font-size:13px;color:#9eabc1;cursor:pointer}td{font-size:14px}th:hover{color:#fff}.scroll{overflow:auto}.score{font-weight:800;color:#7ce4ae}.tag{display:inline-block;border-radius:8px;padding:5px 8px;background:#24374c;font-size:12px}.good{color:#7ce4ae}.warn{color:#ffca83}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0;flex-wrap:wrap}button{background:#253c56;border:1px solid #3c5772;color:white;border-radius:9px;padding:9px 14px;cursor:pointer}button:disabled{opacity:.35;cursor:default}.note{line-height:1.7;font-size:13px}.error{color:#ff9f9f}@media(max-width:700px){.wrap{padding:14px}h1{font-size:22px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}.filters input{grid-column:span 2}header{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><header><div><h1>📈 Market Room</h1><p>台股 × 美股｜波段觀察儀表板</p></div><span class="pill" id="updated">載入中…</span></header><div class="stats"><div class="card"><small>累積成功掃描</small><div class="stat" id="stored">—</div></div><div class="card"><small>近期有效資料</small><div class="stat" id="fresh">—</div></div><div class="card"><small>候選證券總數</small><div class="stat" id="total">—</div></div><div class="card"><small>已嘗試批次</small><div class="stat" id="batch">—</div></div></div><div class="filters"><input id="q" placeholder="搜尋代號或公司名稱"><select id="market"><option value="">全部市場</option></select><select id="group"><option value="">全部技術分類</option></select><select id="minScore"><option value="0">不限分數</option><option value="80">80 分以上</option><option value="90">90 分以上</option><option value="100">100 分</option></select></div><section class="card"><div class="toolbar"><strong>股票觀察排行榜</strong><span class="muted" id="count">準備讀取資料</span></div><div class="scroll"><table><thead><tr><th data-sort="symbol">股票 ↕</th><th data-sort="market">市場 ↕</th><th data-sort="score">評分 ↕</th><th data-sort="swing_group">技術判斷 ↕</th><th data-sort="rsi14">RSI ↕</th><th data-sort="volume_ratio">量比 ↕</th><th data-sort="close">收盤價 ↕</th><th data-sort="date">行情日期 ↕</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><small id="pageInfo"></small><div><button id="prev">上一頁</button> <button id="next">下一頁</button></div></div></section><p class="note">資料來源：Market Room GitHub Actions 的日 K 線掃描結果。只顯示掃描時間與行情日期均在最近 7 天內的證券；不等於全市場即時排行。評分是技術條件分數，非漲幅預測。量比為相對成交量。</p><p class="note" id="status"></p></div><script>
const $=id=>document.getElementById(id);let all=[],view=[],page=0,sortKey='score',sortDir=-1;const pageSize=30;
function csvParse(text){const out=[];let row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c}else if(c==='"')quote=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));out.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);out.push(row)}const head=out.shift()?.map(x=>x.replace(/^\uFEFF/,''))||[];return out.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])))}
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function n(v){const x=Number(v);return Number.isFinite(x)?x.toLocaleString('zh-TW',{maximumFractionDigits:2}):'—'}
function render(){const query=$('q').value.trim().toLowerCase(),m=$('market').value,g=$('group').value,min=Number($('minScore').value);view=all.filter(r=>(!m||r.market===m)&&(!g||r.swing_group===g)&&Number(r.score)>=min&&(!query||(`${r.symbol} ${r.name}`).toLowerCase().includes(query)));view.sort((a,b)=>{const numeric=['score','rsi14','volume_ratio','close'];let x=numeric.includes(sortKey)?Number(a[sortKey]):(a[sortKey]||'');let y=numeric.includes(sortKey)?Number(b[sortKey]):(b[sortKey]||'');return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'zh-Hant'))*sortDir});const pages=Math.max(1,Math.ceil(view.length/pageSize));page=Math.min(page,pages-1);$('count').textContent=`符合條件 ${view.length} 檔`;$('rows').innerHTML=view.slice(page*pageSize,(page+1)*pageSize).map(r=>`<tr><td><b>${safe(r.name||r.symbol)}</b><br><small>${safe(r.symbol)}</small></td><td>${safe(r.market)}</td><td class="score">${safe(r.score)}</td><td><span class="tag">${safe(r.swing_group||r.category)}</span></td><td class="${Number(r.rsi14)>=70?'warn':''}">${n(r.rsi14)}</td><td class="${Number(r.volume_ratio)>=1.5?'good':''}">${n(r.volume_ratio)}</td><td>${n(r.close)}</td><td>${safe(r.date)}</td></tr>`).join('')||'<tr><td colspan="8">目前沒有符合條件的資料</td></tr>';$('pageInfo').textContent=`第 ${page+1} / ${pages} 頁`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1}
async function init(){try{const [csv,meta]=await Promise.all([fetch('./data/ranking.csv?x='+Date.now()).then(r=>{if(!r.ok)throw Error('尚未找到排行榜資料');return r.text()}),fetch('./data/status.json?x='+Date.now()).then(r=>r.ok?r.json():{})]);all=csvParse(csv);$('stored').textContent=n(meta.stored_symbols??all.length);$('fresh').textContent=n(all.length);$('total').textContent=n(meta.candidate_count??0);$('batch').textContent=meta.last_batch==null?'—':`${Number(meta.last_batch)+1} / ${meta.total_batches||'—'}`;$('updated').textContent='更新：'+(meta.last_run_utc?new Date(meta.last_run_utc).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'未知');for(const [id,key] of [['market','market'],['group','swing_group']]){[...new Set(all.map(r=>r[key]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;$(id).appendChild(o)})}render()}catch(e){$('status').className='error';$('status').textContent='尚未載入資料：'+e.message+'。請先執行 V3.3 掃描，並確認 GitHub Pages 已啟用。';$('updated').textContent='等待資料'}}
for(const id of ['q','market','group','minScore'])$(id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()});document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;sortDir=sortKey===k?-sortDir:(k==='score'?-1:1);sortKey=k;page=0;render()}));$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};init();
</script></body></html>
