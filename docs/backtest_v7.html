<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Room V7｜歷史回測研究</title><style>
:root{color-scheme:dark}body{font:16px/1.65 system-ui,"Noto Sans TC",sans-serif;background:#0b1120;color:#e9f0fb;margin:0}main{max-width:1050px;margin:35px auto;padding:0 20px}a{color:#8ecbff}.panel{background:#172236;border:1px solid #30435b;border-radius:16px;padding:22px;margin:20px 0}.row{display:flex;gap:14px;flex-wrap:wrap}select{background:#102038;border:1px solid #43546a;border-radius:8px;padding:10px;color:white;min-width:170px}label{display:grid;gap:5px;color:#aabbd0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:18px;background:#20334a;border-radius:12px}.stat small{color:#b1c1d5;display:block}.stat strong{font-size:26px}.note{color:#d8b988}.muted{color:#aabbd0}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #34465c}th{color:#b1c1d5}@media(max-width:600px){h1{font-size:25px}}
</style></head><body><main><p><a href="./index.html">← 返回 V6 儀表板</a></p><h1>📊 Market Room V7｜歷史回測研究</h1><p class="muted">獨立研究頁面，不會改變正式選股與 LINE 通知。</p><div class="panel"><div class="row"><label>市場<select id="market"><option value="TW">台股</option><option value="US">美股</option></select></label><label>策略<select id="strategy"><option value="B">B 趨勢回檔</option><option value="A">A 初期突破</option></select></label><label>持有交易日<select id="holding"><option>5</option><option>10</option><option selected>20</option><option>40</option></select></label></div><p id="status" class="muted">請選擇回測結果 JSON 檔（GitHub Actions Artifact 解壓縮取得）。</p><input id="file" type="file" accept=".json,application/json" aria-label="選擇回測結果 JSON"></div><div class="stats" id="stats"></div><div class="panel"><h2>回測限制</h2><p class="note">這是當前股票池的歷史樣本研究，具有倖存者與選樣偏差；不是全市場五年真實勝率，也不是資金績效。</p><ul id="limits"></ul></div><div class="panel"><h2>歷史交易樣本（最多顯示 100 筆）</h2><div style="overflow:auto"><table><thead><tr><th>股票</th><th>訊號日</th><th>進場日</th><th>出場日</th><th>淨報酬</th></tr></thead><tbody id="trades"></tbody></table></div></div></main><script>
let data=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(){if(!data)return;const m=$('market').value,s=$('strategy').value,h=$('holding').value;const x=data.summary?.[m]?.[s]?.[h];if(!x)return;$('status').textContent=`產生時間 ${data.generated_utc||''}｜${m} 成功下載 ${data.downloaded_symbols?.[m]??'?'} / ${data.selected_symbols?.[m]??'?'} 檔｜樣本交易 ${x.trades} 筆`;$('stats').innerHTML=[['交易筆數',x.trades],['勝率',x.win_rate_pct==null?'無資料':x.win_rate_pct+'%'],['平均淨報酬',x.mean_return_pct==null?'無資料':x.mean_return_pct+'%'],['獲利因子',x.profit_factor??'無資料'],['單筆最差淨報酬',x.max_trade_drawdown_pct==null?'無資料':x.max_trade_drawdown_pct+'%']].map(([k,v])=>`<div class="stat"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`).join('');$('limits').innerHTML=(data.limitations||[]).map(x=>`<li>${esc(x)}</li>`).join('');const markets=m==='TW'?['TWSE','TPEX']:['NASDAQ','NYSE','NYSE American'];$('trades').innerHTML=(data.trades||[]).filter(x=>markets.includes(x.market)&&x.strategy===s&&String(x.holding_sessions)===h).slice(0,100).map(x=>`<tr><td>${esc(x.symbol)}</td><td>${esc(x.signal_date)}</td><td>${esc(x.entry_date)}</td><td>${esc(x.exit_date)}</td><td>${esc(x.return_pct)}%</td></tr>`).join('')||'<tr><td colspan="5">沒有符合條件的交易樣本</td></tr>'}
for(const id of ['market','strategy','holding'])$(id).addEventListener('change',show);$('file').addEventListener('change',async e=>{try{data=JSON.parse(await e.target.files[0].text());if(!data.summary||!data.trades)throw Error('不是 V7 回測 JSON');show()}catch(e){$('status').textContent='無法讀取：'+e.message}});
</script></body></html>
