name: Market Room Download Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install yfinance pandas numpy
      - name: Generate stock universe
        run: python universe.py
      - name: Clean stock universe
        run: python clean_universe.py --input output/universe.csv
      - name: Benchmark TW and US batch downloads
        run: python test_market_download.py --per-market 30 --chunk-size 10
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-room-download-benchmark
          path: output/benchmark/report.json
          if-no-files-found: warn
