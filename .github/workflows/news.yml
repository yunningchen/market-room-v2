name: Market Room News Center
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,4,8,12 * * *'
permissions:
  contents: write
concurrency:
  group: market-room-news
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Refresh news and IR events
        run: python build_news.py
      - name: Commit news data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh market news and IR events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
