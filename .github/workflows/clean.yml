
name: Market Room V2.1 Cleaner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate stock universe
        run: python universe.py

      - name: Clean stock universe
        run: python clean_universe.py --input output/universe.csv

      - name: Upload cleaning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-room-v21-cleaned
          path: output/
          if-no-files-found: warn
          retention-days: 7
