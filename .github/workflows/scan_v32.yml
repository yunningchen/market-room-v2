
name: Market Room V3.2 Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy

      - name: Generate stock universe
        run: python universe.py

      - name: Clean stock universe
        run: python clean_universe.py --input output/universe.csv

      - name: Inspect cleaning outputs
        run: |
          echo "Available CSV files:"
          find output -maxdepth 4 -type f -name "*.csv" -print

      - name: Run V3.2 technical scanner
        run: |
          python scanner_v32.py --input output/cleaned/candidates.csv --limit 100 --batch-index 0

      - name: Upload V3.2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-room-v32-results
          path: output/
          if-no-files-found: warn
          retention-days: 7
