name: Market Room V3.3 Rotation

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'

permissions:
  contents: write

concurrency:
  group: market-room-v33-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy
      - name: Generate stock universe
        run: python universe.py
      - name: Clean stock universe
        run: python clean_universe.py --input output/universe.csv
      - name: Run next batch and merge rankings
        run: python scanner_v33.py --input output/cleaned/candidates.csv --limit 100
      - name: Update dashboard data
        run: |
          mkdir -p docs/data
          cp output/v33/fresh_ranking.csv docs/data/ranking.csv
          cp output/v33/report.json docs/data/status.json
      - name: Build V4.2 daily history (incremental)
        run: python build_history.py --limit 12
      - name: Build V5 signal changes
        run: python build_signals.py
      - name: Save rotation state, master and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v33/state.json data/v33/master.csv docs/data/ranking.csv docs/data/status.json docs/data/history/ docs/data/signals.json docs/data/signals_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update V3.3 progress and V5 dashboard"
            git push
          fi
      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-room-v33-results
          path: |
            output/v32/
            output/v33/
            data/v33/state.json
          if-no-files-found: warn
          retention-days: 7
