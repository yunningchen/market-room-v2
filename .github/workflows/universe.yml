
name: Market Room V2 Universe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build stock universe
        run: python universe.py

      - name: Upload universe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-room-universe
          path: |
            output/
            results/
          if-no-files-found: error
