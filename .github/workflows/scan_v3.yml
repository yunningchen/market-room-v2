
name: Market Room V3 Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Generate stock universe
        run: python universe.py

      - name: Clean stock universe
        run: python clean_universe.py --input output/universe.csv

      - name: Run V3 technical scanner
        run: python scanner_v3.py

      - name: Upload V3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-room-v3-results
          path: output/
          if-no-files-found: warn
          retention-days: 7
